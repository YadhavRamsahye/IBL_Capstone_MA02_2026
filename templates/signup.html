<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Traffic Bottleneck Detection</title>
    <link rel="icon" type="image/jpeg" href="/static/ibl-logo.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-area { text-align: center; margin-bottom: 32px; }

        .logo-icon {
            width: 72px; height: 72px;
            background: #ffffff; padding: 6px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; overflow: hidden;
        }
        .logo-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .logo-area h1 { color: #ffffff; font-size: 20px; font-weight: 700; line-height: 1.3; }
        .logo-area p  { color: rgba(255, 255, 255, 0.5); font-size: 13px; margin-top: 6px; }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block; color: rgba(255, 255, 255, 0.7);
            font-size: 13px; font-weight: 500; margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; color: #ffffff; font-size: 15px;
            transition: border-color 0.2s, background 0.2s; outline: none;
        }

        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .form-group input:focus { border-color: #e94560; background: rgba(255, 255, 255, 0.12); }

        .error-msg {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            color: #ff7f95; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 20px; text-align: center;
        }

        .signup-btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none; border-radius: 8px; color: #ffffff;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.5px;
        }

        .signup-btn:hover  { opacity: 0.9; transform: translateY(-1px); }
        .signup-btn:active { transform: translateY(0); }

        .login-link {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: rgba(255, 255, 255, 0.4);
        }

        .login-link a { color: #e94560; text-decoration: none; font-weight: 500; }
        .login-link a:hover { text-decoration: underline; }

        .footer-text {
            text-align: center; margin-top: 20px;
            color: rgba(255, 255, 255, 0.2); font-size: 11px;
        }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: 24px; }
            .signup-container { padding: 32px 20px; margin: 0 16px 24px; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo-area">
            <div class="logo-icon">
                <img src="/static/ibl-logo.jpg" alt="IBL Group">
            </div>
            <h1>Create Account</h1>
            <p>AI Traffic Bottleneck Detection System</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="/signup">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus minlength="3">
            </div>
            <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" required
                           autocomplete="email">
                    <div style="color:rgba(255,255,255,.35);font-size:12px;margin-top:6px;">
                        Used only to recover your account if you forget your password.
                    </div>
                </div>

                <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
            </div>
            <button type="submit" class="signup-btn">Create Account</button>
        </form>

        <div class="login-link">Already have an account? <a href="/login">Sign in</a></div>
        <div class="footer-text">IBL Capstone Project - MA02 2026</div>
    </div>
</body>
</html>
